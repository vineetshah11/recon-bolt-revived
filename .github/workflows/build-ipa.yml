name: Build Recon Bolt iOS IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package IPA (macOS SwiftPM)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build Recon_Bolt Package
        run: |
          swift build -c release --triple arm64-apple-ios16.0

      - name: Package App and IPA
        run: |
          mkdir -p build/Payload/ReconBolt.app
          cp .build/arm64-apple-ios16.0/release/libRecon_Bolt.dylib build/Payload/ReconBolt.app/ReconBolt 2>/dev/null || cp .build/arm64-apple-ios16.0/release/Recon_Bolt build/Payload/ReconBolt.app/ReconBolt 2>/dev/null || true
          cp xtool-Info.plist build/Payload/ReconBolt.app/Info.plist
          cp -R Shared/BundledAssets build/Payload/ReconBolt.app/ 2>/dev/null || true
          cp -R Shared/BundledIcons/* build/Payload/ReconBolt.app/ 2>/dev/null || true
          cd build
          zip -r -q ReconBolt.ipa Payload
          ls -lh ReconBolt.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReconBolt-ipa
          path: build/ReconBolt.ipa
          retention-days: 90
