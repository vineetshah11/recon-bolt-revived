name: Build Recon Bolt iOS IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build Recon Bolt (iOS) Archive
        run: |
          xcodebuild archive \
            -scheme "Recon_Bolt" \
            -destination "generic/platform=iOS" \
            -archivePath "build/ReconBolt.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package App and IPA
        run: |
          mkdir -p build/Payload
          cp -R "build/ReconBolt.xcarchive/Products/Applications/"*.app build/Payload/ 2>/dev/null || cp -R "build/ReconBolt.xcarchive/Products/usr/local/lib/"* build/Payload/ 2>/dev/null || true
          if [ ! -d build/Payload/*.app ]; then
            mkdir -p build/Payload/ReconBolt.app
            find build/ReconBolt.xcarchive -type f -perm +111 -exec cp {} build/Payload/ReconBolt.app/ReconBolt \; 2>/dev/null || true
            cp xtool-Info.plist build/Payload/ReconBolt.app/Info.plist
            cp -R Shared/BundledAssets build/Payload/ReconBolt.app/ 2>/dev/null || true
            cp -R Shared/BundledIcons/* build/Payload/ReconBolt.app/ 2>/dev/null || true
          fi
          cd build
          zip -r -q ReconBolt.ipa Payload
          ls -lh ReconBolt.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReconBolt-ipa
          path: build/ReconBolt.ipa
          retention-days: 90
