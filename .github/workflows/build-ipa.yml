name: Build Vantage iOS IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies -project "Recon Bolt.xcodeproj"

      - name: Build & Archive Vantage
        run: |
          xcodebuild archive \
            -project "Recon Bolt.xcodeproj" \
            -scheme "Recon Bolt (iOS)" \
            -destination "generic/platform=iOS" \
            -archivePath "build/Vantage.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package into IPA
        run: |
          mkdir -p build/Payload
          cp -R "build/Vantage.xcarchive/Products/Applications/Vantage.app" build/Payload/
          cd build
          zip -r -q "Vantage.ipa" Payload
          ls -lh Vantage.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vantage-ipa
          path: build/Vantage.ipa
          retention-days: 90

