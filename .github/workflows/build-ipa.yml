name: Build Recon Bolt iOS IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package IPA (Linux xtool)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.10"

      - name: Install xtool & system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libxml2 libcurl4 zip libfuse2
          curl -sL https://github.com/xtool-org/xtool/releases/download/1.24.0/xtool-x86_64.AppImage -o /usr/local/bin/xtool
          sudo chmod +x /usr/local/bin/xtool

      - name: Build IPA using xtool
        run: |
          xtool build -c release
          mkdir -p build
          cp -v xtool/*.ipa build/ReconBolt.ipa || cp -v *.ipa build/ReconBolt.ipa || find . -name "*.ipa" -exec cp -v {} build/ReconBolt.ipa \;
          ls -lh build/ReconBolt.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReconBolt-ipa
          path: build/ReconBolt.ipa
          retention-days: 90
